name: omnisport-digitale

x-application: &application
  image: omnisport-digitale:development
  pull_policy: never
  environment: &application-environment
    OMNI_ENVIRONMENT: development
    OMNI_DB_HOST: db
    OMNI_DB_PORT: 3306
    OMNI_DB_NAME: ${OMNI_DB_NAME:-omnisport}
    OMNI_DB_USER: ${OMNI_DB_USER:-omnisport}
    OMNI_DB_PASSWORD: ${OMNI_DB_PASSWORD:?Run python scripts/configure.py first}
    OMNI_COOKIE_SECURE: ${OMNI_COOKIE_SECURE:-false}
    OMNI_AUTH_ORIGINS: '${OMNI_AUTH_ORIGINS:-["http://127.0.0.1:8000","http://localhost:8000","http://127.0.0.1:8001","http://localhost:8001"]}'

services:
  kafka:
    image: apache/kafka:4.4.0
    hostname: kafka
    environment:
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT://:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    volumes:
      - kafka-data:/var/lib/kafka/data
    mem_limit: 1g
    restart: unless-stopped

  db:
    image: mysql:8.4.13
    environment:
      MYSQL_DATABASE: ${OMNI_DB_NAME:-omnisport}
      MYSQL_USER: ${OMNI_DB_USER:-omnisport}
      MYSQL_PASSWORD: ${OMNI_DB_PASSWORD:?Run python scripts/configure.py first}
      MYSQL_ROOT_PASSWORD: ${OMNI_DB_ROOT_PASSWORD:?Run python scripts/configure.py first}
      TZ: UTC
    ports:
      - "127.0.0.1:${OMNI_DB_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=TCP -h 127.0.0.1 -u\"$$MYSQL_USER\" -D\"$$MYSQL_DATABASE\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      start_period: 25s
      retries: 30

  migrate:
    <<: *application
    command: ["python", "-m", "alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    <<: *application
    build:
      context: .
      target: runtime
    ports:
      - "127.0.0.1:${OMNI_HTTP_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 12
    restart: unless-stopped

  event-worker:
    <<: *application
    command: ["python", "-m", "backend.app.event_worker"]
    environment:
      <<: *application-environment
      OMNI_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      OMNI_KAFKA_BOOKING_TOPIC: booking-events.v1
      OMNI_KAFKA_DEAD_LETTER_TOPIC: booking-events.dlq
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  seed:
    <<: *application
    profiles: ["tools"]
    command: ["python", "-m", "backend.app.seed", "--demo"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  test-db:
    profiles: ["test"]
    image: mysql:8.4.13
    environment:
      MYSQL_DATABASE: omnisport_test
      MYSQL_USER: omni_test
      MYSQL_PASSWORD: isolated-test-password
      MYSQL_ROOT_PASSWORD: isolated-test-root-password
      TZ: UTC
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=TCP -h 127.0.0.1 -u\"$$MYSQL_USER\" -D\"$$MYSQL_DATABASE\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      start_period: 25s
      retries: 30

  test:
    profiles: ["test"]
    build:
      context: .
      target: test
    environment:
      OMNI_TEST_DATABASE_URL: mysql+pymysql://omni_test:isolated-test-password@test-db:3306/omnisport_test
    depends_on:
      test-db:
        condition: service_healthy

volumes:
  kafka-data:
  mysql-data:
