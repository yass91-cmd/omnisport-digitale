name: omnisport-digitale

x-application: &application
  image: omnisport-digitale:development
  pull_policy: never
  environment: &application-environment
    OMNI_ENVIRONMENT: development
    OMNI_DB_HOST: db
    OMNI_DB_PORT: 3306
    OMNI_DB_NAME: ${OMNI_DB_NAME:-omnisport}
    OMNI_DB_USER: ${OMNI_DB_USER:-omnisport}
    OMNI_DB_PASSWORD: ${OMNI_DB_PASSWORD:?Run python scripts/configure.py first}

services:
  db:
    image: mysql:8.4.13
    environment:
      MYSQL_DATABASE: ${OMNI_DB_NAME:-omnisport}
      MYSQL_USER: ${OMNI_DB_USER:-omnisport}
      MYSQL_PASSWORD: ${OMNI_DB_PASSWORD:?Run python scripts/configure.py first}
      MYSQL_ROOT_PASSWORD: ${OMNI_DB_ROOT_PASSWORD:?Run python scripts/configure.py first}
      TZ: UTC
    ports:
      - "127.0.0.1:${OMNI_DB_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=TCP -h 127.0.0.1 -u\"$$MYSQL_USER\" -D\"$$MYSQL_DATABASE\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      start_period: 25s
      retries: 30

  migrate:
    <<: *application
    command: ["python", "-m", "alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    <<: *application
    build:
      context: .
      target: runtime
    ports:
      - "127.0.0.1:${OMNI_HTTP_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 12
    restart: unless-stopped

  seed:
    <<: *application
    profiles: ["tools"]
    command: ["python", "-m", "backend.app.seed", "--demo"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  test-db:
    profiles: ["test"]
    image: mysql:8.4.13
    environment:
      MYSQL_DATABASE: omnisport_test
      MYSQL_USER: omni_test
      MYSQL_PASSWORD: isolated-test-password
      MYSQL_ROOT_PASSWORD: isolated-test-root-password
      TZ: UTC
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=TCP -h 127.0.0.1 -u\"$$MYSQL_USER\" -D\"$$MYSQL_DATABASE\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      start_period: 25s
      retries: 30

  test:
    profiles: ["test"]
    build:
      context: .
      target: test
    environment:
      OMNI_TEST_DATABASE_URL: mysql+pymysql://omni_test:isolated-test-password@test-db:3306/omnisport_test
    depends_on:
      test-db:
        condition: service_healthy

volumes:
  mysql-data:
