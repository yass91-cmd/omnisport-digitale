name: Application checks

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4.13
        env:
          MYSQL_DATABASE: omnisport_test
          MYSQL_USER: omni_test
          MYSQL_PASSWORD: isolated-test-password
          MYSQL_ROOT_PASSWORD: isolated-test-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
          --health-start-period=25s
      kafka:
        image: apache/kafka:4.4.0
        env:
          CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT://:9092
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
        ports:
          - 9092:9092
        options: >-
          --health-cmd="/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"
          --health-interval=10s
          --health-timeout=10s
          --health-start-period=30s
          --health-retries=12
    env:
      OMNI_TEST_DATABASE_URL: mysql+pymysql://omni_test:isolated-test-password@127.0.0.1:3306/omnisport_test
      OMNI_DATABASE_URL: mysql+pymysql://omni_test:isolated-test-password@127.0.0.1:3306/omnisport_test
      OMNI_TEST_KAFKA_BOOTSTRAP_SERVERS: localhost:9092
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Check repository privacy
        run: python scripts/check_repository.py
      - name: Check Python source
        run: |
          ruff check backend migrations scripts tests
          ruff format --check backend migrations scripts tests
      - name: Test against SQLite and MySQL
        run: python -m pytest -v
      - name: Apply and check migrations
        run: |
          python -m alembic upgrade head
          python -m alembic check
          python -m backend.app.seed --demo
      - name: Check JavaScript syntax
        run: |
          for file in frontend/dist/assets/*.js; do node --check "$file"; done
      - name: Test browser business rules
        run: node --test frontend/tests/*.test.js
      - name: Build release image
        run: docker build --target runtime -t omnisport-ci .
      - name: Start release image
        run: >-
          docker run -d --name omnisport-smoke --network host
          -e OMNI_DATABASE_URL="$OMNI_DATABASE_URL" omnisport-ci
      - name: Verify release image
        run: |
          curl --fail --retry 20 --retry-connrefused --retry-delay 1 http://127.0.0.1:8000/health/ready
          python scripts/smoke.py
          docker exec omnisport-smoke python -c "from pathlib import Path; assert not [p for p in Path('/app').rglob('*') if p.suffix.lower() in {'.md', '.markdown', '.pdf'}]"
      - name: Show application logs
        if: failure()
        run: docker logs omnisport-smoke || true
      - name: Stop release image
        if: always()
        run: docker rm -f omnisport-smoke || true

  publish-image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test-and-package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish release image
        env:
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          IMAGE="${IMAGE,,}"
          docker build --target runtime \
            --tag "$IMAGE:latest" \
            --tag "$IMAGE:sha-$GITHUB_SHA" .
          docker push "$IMAGE:sha-$GITHUB_SHA"
          docker push "$IMAGE:latest"
