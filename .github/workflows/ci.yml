name: Application checks

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4.13
        env:
          MYSQL_DATABASE: omnisport_test
          MYSQL_USER: omni_test
          MYSQL_PASSWORD: isolated-test-password
          MYSQL_ROOT_PASSWORD: isolated-test-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
          --health-start-period=25s
    env:
      OMNI_TEST_DATABASE_URL: mysql+pymysql://omni_test:isolated-test-password@127.0.0.1:3306/omnisport_test
      OMNI_DATABASE_URL: mysql+pymysql://omni_test:isolated-test-password@127.0.0.1:3306/omnisport_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Check repository privacy
        run: python scripts/check_repository.py
      - name: Check Python source
        run: |
          ruff check backend migrations scripts tests
          ruff format --check backend migrations scripts tests
      - name: Test against SQLite and MySQL
        run: python -m pytest -v
      - name: Apply and check migrations
        run: |
          python -m alembic upgrade head
          python -m alembic check
          python -m backend.app.seed --demo
      - name: Check JavaScript syntax
        run: |
          for file in frontend/dist/assets/*.js; do node --check "$file"; done
      - name: Build release image
        run: docker build --target runtime -t omnisport-ci .
      - name: Start release image
        run: >-
          docker run -d --name omnisport-smoke --network host
          -e OMNI_DATABASE_URL="$OMNI_DATABASE_URL" omnisport-ci
      - name: Verify release image
        run: |
          curl --fail --retry 20 --retry-connrefused --retry-delay 1 http://127.0.0.1:8000/health/ready
          python scripts/smoke.py
          docker exec omnisport-smoke python -c "from pathlib import Path; assert not [p for p in Path('/app').rglob('*') if p.suffix.lower() in {'.md', '.markdown', '.pdf'}]"
      - name: Show application logs
        if: failure()
        run: docker logs omnisport-smoke || true
      - name: Stop release image
        if: always()
        run: docker rm -f omnisport-smoke || true
