<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#10140f">
  <title>Your complex — OmniSport Digitale</title>
  <link rel="icon" href="assets/mark.svg" type="image/svg+xml"><link rel="stylesheet" href="assets/styles.css">
  <script type="module" src="assets/workspace.js"></script>
</head>
<body class="directory">
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header"><a class="brand" href="./" aria-label="OmniSport Digitale home"><img src="assets/mark.svg" width="42" height="42" alt=""><span>OMNISPORT<span class="brand-sub">DIGITALE</span></span></a><nav class="header-nav" aria-label="Main navigation"><a href="account.html">My account</a></nav></header>
  <main class="directory-main" id="main">
    <p class="eyebrow">YOUR COMPLEX WORKSPACE</p>
    <p id="workspace-status" role="status">Getting your complex ready…</p>
    <section id="workspace-view" hidden>
      <span class="role-badge" id="workspace-role"></span>
      <h1 class="complex-title" id="workspace-name"></h1><p class="complex-location" id="workspace-city"></p>
      <p class="catalog-note" id="workspace-note">Your facilities are listed below.</p>
      <div class="facilities-heading"><h2>Your sports &amp; facilities</h2><a class="primary-button" id="add-facility" hidden>Add facility</a></div><div class="workspace-sports" id="workspace-facilities"></div>
      <section class="staff-section" id="workspace-staff" hidden><h2>Assigned staff</h2><div id="workspace-staff-list"></div><p id="staff-load-message" role="status"></p></section>
    </section>
    <section class="empty-directory" id="workspace-error" hidden><h1 id="workspace-error-title">We couldn’t load this workspace.</h1><p id="workspace-error-message"></p><button class="text-link message-action" id="workspace-retry">Try again</button><a class="text-link" href="account.html">Go to my account</a></section>
  </main>
</body>
</html>
